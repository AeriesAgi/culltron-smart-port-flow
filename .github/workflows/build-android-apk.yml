name: Build Android Driver Companion APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/SmartPortDriverCompanion/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/SmartPortDriverCompanion
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPortDriverCompanion-debug-apk
          path: mobile/SmartPortDriverCompanion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
